[project]
name = "schedulease"
version = "0.1.0"
description = "A TUI program for scheduling course elections in NKU"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "click>=8.5.0",
    "hjson>=3.1.0",
    "httpx[socks]>=0.28.1",
    "lxml>=7.0.0b1",
    "pathlib>=1.0.1",
    "playwright>=1.64.1",
    "polars>=2.1.0",
    "prompt-toolkit>=3.0.53",
    "pycryptodome>=4.3.0",
    "pydantic>=2.14.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "schedule>=1.2.2",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
dev = ["jupyter>=1.1.1", "nuitka>=2.7.13"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tests" = ["test_data.json"]

[project.scripts]
eamis = "eamis.tui.main:main"
libic = "libic.cli.main:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade 
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async checks
    "PTH",   # flake8-use-pathlib
]
ignore = [
    "E501",   # line length (formatter handles this)
    "B008",   # function calls in defaults (sometimes intentional in CLI/typing use)
    "RUF001", # ambiguous unicode characters (often false positives in docstrings/comments)
    "RUF002", # ambiguous unicode characters (often false positives in docstrings/comments)
    "RUF003", # ambiguous unicode characters (often false positives in docstrings/comments)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
